<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>TERON Miner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">TERON <span>MINER</span></div>
    <button id="adminBtn" class="icon hidden">⚙</button>
  </header>

  <main id="screen"></main>

  <nav class="nav">
    <button data-screen="mine">⛏️<small>Mine</small></button>
    <button data-screen="tasks">📋<small>Tasks</small></button>
    <button data-screen="boost">⚡<small>Boost</small></button>
    <button data-screen="friends">👥<small>Friends</small></button>
    <button data-screen="profile">👤<small>Profile</small></button>
  </nav>
</div>
<script src="/app.js"></script>
</body>
</html>
